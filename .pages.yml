media:
  input: images
  output: images

content:
  - name: site
    label: 포트폴리오 내용
    type: file
    path: content.json
    format: json
    fields:
      - name: cursor
        label: 마우스 커서
        type: object
        fields:
          - name: image
            label: 커서 이미지 (PNG)
            description: 배경이 투명한 PNG. 이미지 정중앙이 클릭 지점이에요. 비워두면 작은 흰 점으로 보여요.
            type: image
          - name: size
            label: 커서 크기 (px)
            description: 1920 화면 기준 가로 크기. 기본 32.
            type: number

      - name: hero
        label: 메인 (첫 화면)
        type: object
        fields:
          - name: logo
            label: MaH 로고 이미지
            description: SVG 또는 배경이 투명한 PNG. 비워두면 글자로 표시돼요.
            type: image
          - name: subtitle
            label: MaH 아래 글씨
            type: string

      - name: about
        label: About Me
        type: object
        fields:
          - name: intro
            label: 소개 문구
            type: text
          - name: career
            label: Experience (경력)
            description: 회사 이름은 Index의 Company 묶음 이름으로도 쓰여요. 위에서부터 순서대로 보여요.
            type: object
            list: true
            fields:
              - name: period
                label: 기간
                type: string
              - name: company
                label: 회사
                type: string
              - name: role
                label: 팀 · 직무
                type: string
          - name: freelance
            label: Freelance
            description: 외주·프리랜스 작업
            type: object
            list: true
            fields:
              - name: period
                label: 기간
                type: string
              - name: title
                label: 이름
                type: string
              - name: desc
                label: 설명 (작은 글씨)
                type: string
          - name: education
            label: Education
            description: 학력
            type: object
            list: true
            fields:
              - name: period
                label: 기간
                type: string
              - name: title
                label: 이름
                type: string
              - name: desc
                label: 설명 (작은 글씨)
                type: string
          - name: awards
            label: Awards & Exhibitions
            description: 수상·전시
            type: object
            list: true
            fields:
              - name: period
                label: 기간
                type: string
              - name: title
                label: 이름
                type: string
              - name: desc
                label: 설명 (작은 글씨)
                type: string
          - name: activities
            label: Activities
            description: 워크숍·스터디·대외활동
            type: object
            list: true
            fields:
              - name: period
                label: 기간
                type: string
              - name: title
                label: 이름
                type: string
              - name: desc
                label: 설명 (작은 글씨)
                type: string

      - name: categories
        label: 카테고리 순서
        type: string
        list: true
        hidden: true

      - name: projects
        label: 프로젝트
        description: 위에서부터 01, 02... 순서로 번호가 붙어요. 순서를 바꾸면 번호도 바뀌어요.
        type: object
        list: true
        fields:
          - name: title
            label: 제목
            type: string
            required: true
          - name: subtitle
            label: 부제
            type: string
          - name: client
            label: 클라이언트
            type: string
          - name: company
            label: 회사 (Company 묶음)
            description: Index의 Company 보기에서 이 회사 묶음에 들어가요. About 경력의 회사 이름과 철자를 똑같이 써주세요. 여러 개 가능.
            type: string
            list: true
          - name: categories
            label: 카테고리 (Category 필터)
            description: 여러 개 고를 수 있어요.
            type: select
            options:
              multiple: true
              values:
                - Campaign
                - Album & Art Direction
                - Logo & Type
                - Character
                - Contents
          - name: period
            label: 프로젝트 기간
            description: "예: 2025.03 — 2025.06 (한 달짜리면 2025.03만 써도 돼요)"
            type: string
          - name: role
            label: 역할
            type: string
          - name: coverImage
            label: 커버 이미지 (화면 꽉 채움)
            description: 프로젝트를 열면 첫 화면 배경으로 꽉 차게 보여요. 1920×1080 이상 권장.
            type: image
          - name: dim
            label: 커버 딤 농도 (0~100)
            description: 숫자가 클수록 어두워져요. 기본 50.
            type: number
          - name: bgColor
            label: 프로젝트 배경색
            description: "#F9F9F9" 형식 (기본 화이트). 프로젝트마다 다른 무드를 줄 수 있어요.
            type: string
          - name: textColor
            label: 프로젝트 글자색
            description: "#111111" 형식 (기본 검정).
            type: string
          - name: thumbnail
            label: Index 호버 이미지
            type: image
          - name: mainImage
            label: 메인 이미지
            type: image
          - name: overview
            label: 개요
            description: 빈 줄을 넣으면 문단이 나뉘어요.
            type: text
          - name: touchImage
            label: MaH's touch 이미지
            type: image
          - name: touches
            label: MaH's touch 마커
            description: 비워두면 이 블록이 숨겨져요. 위치는 이미지 왼쪽 위 기준 % (0~100).
            type: object
            list: true
            fields:
              - name: x
                label: 가로 위치 (%)
                type: number
              - name: y
                label: 세로 위치 (%)
                type: number
              - name: comment
                label: 코멘트
                type: text
          - name: kvImage
            label: 키비주얼 (One KV → Touchpoints)
            type: image
          - name: touchpoints
            label: 확장 매체
            description: 키비주얼과 확장 매체를 모두 비워두면 이 블록이 숨겨져요.
            type: object
            list: true
            fields:
              - name: label
                label: 매체 이름
                type: string
              - name: image
                label: 이미지
                type: image
          - name: gallery
            label: 추가 이미지
            type: image
            list: true
          - name: resultText
            label: 결과 설명
            description: 결과 설명과 수치를 모두 비워두면 이 블록이 숨겨져요.
            type: string
          - name: resultValue
            label: 결과 수치
            type: string
          - name: isDailyWall
            label: Daily Contents 벽으로 보여주기
            description: 켜면 프로젝트 뷰에서 상세 블록 대신 Daily Contents 이미지가 흐르는 벽으로 보여요.
            type: boolean

      - name: daily
        label: Daily Contents
        type: object
        fields:
          - name: thumbnails
            label: 1줄 — 썸네일
            type: image
            list: true
          - name: banners
            label: 2줄 — 배너
            type: image
            list: true
          - name: details
            label: 3줄 — 상세페이지
            type: image
            list: true

      - name: contact
        label: Contact
        type: object
        fields:
          - name: heading
            label: 큰 문구
            type: text
          - name: email
            label: 이메일
            type: string
          - name: links
            label: 링크
            type: object
            list: true
            fields:
              - name: label
                label: 이름
                type: string
              - name: url
                label: 주소
                type: string
